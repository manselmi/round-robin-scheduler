# vim: set ft=toml :


# https://github.com/jdx/mise/pull/11354
min_version = '2026.7.15'


[hooks]
postinstall = [{ task = 'hooks-install' }, { run = 'pixi install --all' }]


[settings]
experimental = true
locked = true
lockfile = true
lockfile_platforms = ['linux-arm64', 'linux-x64', 'macos-arm64']


[task_config]
cascade = true
shell = 'sh -euo pipefail -c'


[tasks.hooks-install]
hide = true
run = [{ task = 'hooks-uninstall' }, 'hk install --mise']

[tasks.hooks-uninstall]
hide = true
run = 'hk uninstall'

[tasks.lint]
run = 'hk fix --all'

[tasks.lock]
# required to correctly initialize lockfile when locked = true
env.MISE_LOCKED = '0'
run = ['mise install', 'mise lock', 'pixi lock']

[tasks.upgrade]
# required to correctly initialize lockfile when locked = true
env.MISE_LOCKED = '0'
run = ['mise upgrade --local', 'mise lock', 'pixi update']


[tools]
hk = 'latest'
pixi = 'latest'
